<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark"><meta name="theme-color" content="#070a1f">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Readings">
<meta name="description" content="Draw tarot, Lenormand and astrology dice, then copy a ready-made prompt into ChatGPT or Claude.">
<title>Reading Prompt Builder</title>
<style>
:root{--bg:#f7f6f3;--card:#fff;--ink:#1f1d1a;--muted:#6f6a63;--line:#e3dfd8;--accent:#5b4b8a;--accent-ink:#fff;--back:#2c2550;--rev:#b03a2e;--gold:#c9b27a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body.lock{overflow:hidden}
main{max-width:640px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:var(--muted);font-size:13px;margin:0 0 12px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:24px 0 8px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
textarea,select,input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
textarea{resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.split>*{flex:1}
button,.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 16px;cursor:pointer;-webkit-tap-highlight-color:transparent;text-decoration:none;display:inline-block;text-align:center}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.small{padding:6px 12px;font-size:13px}
button:disabled{opacity:.4}
.drawhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.drawhead b{font-size:16px}
.tag{font-size:13px;color:var(--muted);margin:4px 0 8px}
.addrow button{flex:1;white-space:nowrap;padding:10px 8px;font-size:14px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:8px}
.slots.gt{grid-template-columns:repeat(8,1fr);gap:3px}
.slot{display:flex;flex-direction:column;gap:4px}
.slot .pos{font-size:11px;color:var(--muted);line-height:1.2;min-height:2.4em}
.face{aspect-ratio:2/3;border-radius:8px;border:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:4px;font-size:13px;line-height:1.2;width:100%}
.face .n{font-size:11px;color:var(--muted)}
.face.rev .nm{transform:rotate(180deg)}
.face .r{font-size:10px;color:var(--rev);margin-top:4px;font-weight:600}
.gt .face{font-size:8.5px;border-radius:4px;padding:1px;aspect-ratio:auto;height:58px;overflow:hidden;word-break:break-word}
.gt .face .n{font-size:8px}
.gt .slot .pos{min-height:0;font-size:9px;text-align:center}
.gt .fate.first{grid-column-start:3}
.dice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.die{border:1px solid var(--line);border-radius:12px;padding:14px 6px;text-align:center;background:var(--bg)}
.die .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.die .v{font-size:17px;margin-top:4px}
.rolling .die .v{animation:jig .1s infinite alternate}
@keyframes jig{from{transform:translateX(-5px) rotate(-6deg)}to{transform:translateX(5px) rotate(6deg)}}
#prompt{min-height:280px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.45}
.hint{font-size:13px;color:var(--muted)}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:12px;color:var(--ink)}
.toggle input{width:auto;margin:0}
details.hist{border-top:1px solid var(--line);padding:10px 0;font-size:14px}
details.hist:first-child{border-top:none}
details.hist summary{cursor:pointer}
details.hist pre{white-space:pre-wrap;font-size:12px;background:var(--bg);padding:10px;border-radius:10px;max-height:240px;overflow:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:100}
.toast.on{opacity:1}

.pick{display:grid;gap:10px}
.pickbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border-radius:14px;padding:18px 16px}
.pickbtn b{font-size:18px}.pickbtn span{font-size:13px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;border-radius:10px;padding:10px 12px;font-size:15px}
.opt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card));font-weight:600}
button.big{width:100%;padding:14px;font-size:16px;margin-top:16px}
button.link{background:none;border:none;padding:4px 0;color:var(--accent);font-size:15px}
.qshow{font-size:15px;margin:0 0 12px}.qshow span{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
details.bg,details.popts{margin-top:12px}summary{cursor:pointer;color:var(--muted);font-size:14px}
/* Classic blue checked back (generic CSS pattern) */
.back-art{background:var(--star) center/34% no-repeat,radial-gradient(ellipse at 50% 45%,#3b3a78 0%,#262c45 70%);box-shadow:inset 0 0 0 3px #f6f3ec,inset 0 0 0 6px #262c45,inset 0 0 0 7px #c4b5fd99,0 1px 2px rgba(0,0,0,.35)}
.face.photo{padding:0;overflow:hidden;aspect-ratio:300/527;border:none;background:#e9e3d6}
.face.photo img,.ff.photo img{width:100%;height:100%;object-fit:cover;display:block}
.face.photo.rev img,.ff.photo.rev img{transform:rotate(180deg)}
.cap{font-size:12px;line-height:1.25;text-align:center}.cap .r{color:var(--rev);font-weight:600}
.rv.tarot .fc{aspect-ratio:300/527}
.ff.photo{padding:0;overflow:hidden;background:#e9e3d6;box-shadow:none}
.fl .cn{display:block;color:#ece9f2;font-weight:600;opacity:0;transition:opacity .4s .4s}
.rv-slot.open .fl .cn{opacity:1}
.die .g{font-size:30px;line-height:1.1;margin-top:4px;font-family:"Apple Symbols","Segoe UI Symbol","Noto Sans Symbols","DejaVu Sans",serif}
.die .v{font-size:14px!important}
/* ---------- Card back (original design) ---------- */

/* ---------- Table overlay ---------- */
#ov{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 40%,#232036,#121019 75%);color:#ece9f2;display:none;flex-direction:column;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#ov.on{display:flex}
.tb-head{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding:12px 12px 6px;gap:8px}
.tb-x{background:transparent;color:inherit;border:1px solid #3a3550;width:36px;height:36px;padding:0;border-radius:50%;font-size:15px}
.tb-step{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#a59fc0;text-align:center}
.tb-hint{font-size:15px;text-align:center;margin-top:2px;line-height:1.3}
.tb-count{font-size:13px;color:#a59fc0;text-align:right}
.tb-table{position:relative;flex:1;overflow:hidden;touch-action:none}
.tb-table.rv-mode{touch-action:pan-y;overflow:auto}
.tb-foot{padding:10px 14px calc(14px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:66px}
.tb-foot button{background:#2a2638;color:#ece9f2;border-color:#3a3550}
.tb-foot button.primary{background:var(--gold);color:#1b1824;border-color:var(--gold)}
.tcard{position:absolute;left:0;top:0;width:var(--cw);height:var(--ch);border-radius:6px;will-change:transform}
.tb-table.anim .tcard{transition:transform .55s cubic-bezier(.2,.7,.2,1)}
.tb-slots{position:absolute;left:0;right:0;top:10px;display:flex;flex-wrap:wrap;justify-content:center;gap:28px 10px;padding:0 8px;pointer-events:none}
.tb-slot{border:1px dashed #514a72;border-radius:5px;position:relative}
.tb-slot span{position:absolute;top:100%;margin-top:3px;left:-8px;right:-8px;text-align:center;font-size:9.5px;line-height:1.1;color:#8e88a8}
.rv{padding:14px 12px 24px}
.rv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:16px 12px;margin:0 auto}
.rv.gt .rv-grid{grid-template-columns:repeat(8,1fr);gap:8px 3px}
.rv.gt .fate.first{grid-column-start:3}
.rv-slot{display:flex;flex-direction:column;gap:6px}
.fc{perspective:900px;aspect-ratio:2/3;width:100%;background:none;border:none;padding:0;border-radius:8px}
.fci{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.fc.open .fci{transform:rotateY(180deg)}
.fb,.ff{position:absolute;inset:0;border-radius:8px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.ff{transform:rotateY(180deg);background:#f4efe4;color:#231f2e;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px;font-size:13px;line-height:1.2;box-shadow:inset 0 0 0 1px #d9cfb8}
.ff .n{font-size:11px;color:#7a7266}
.ff.rev .inner{transform:rotate(180deg)}
.ff .r{font-size:10px;color:#b03a2e;margin-top:5px;font-weight:600}
.rv.gt .ff{font-size:8px;padding:1px;word-break:break-word}
.rv.gt .ff .n{font-size:7.5px}
.fl{font-size:11px;color:#a59fc0;text-align:center;line-height:1.2}
.rv.gt .fl{font-size:9px}

/* ================= Design System theme (violet / navy, pill-first) ================= */
:root{--violet-450:#9963f2;--shades-50:#f9fafd;--shades-100:#eff1f8;--shades-200:#dbdee9;--shades-400:#9ba0b3;--shades-800:#262c45;
--background:#ffffff;--foreground:#262c45;--card:#ffffff;--primary:#9963f2;--primary-foreground:#f8fafc;--secondary:#f1f5f9;--secondary-foreground:#0f172a;
--muted:#eff1f8;--muted-foreground:#9ba0b3;--accent:#f1f5f9;--destructive:#fb7185;--border:#e2e8f0;--input:#e2e8f0;--ring:#a78bfa;--indigo-700:#4338ca;
--radius-sm:12px;--radius-md:16px;--radius-lg:24px;--radius-full:9999px;
--shadow-xs:0 1px 2px 0 #0000000d;--shadow-sm:0 1px 3px 0 #0000001a,0 1px 2px -1px #0000001a;--shadow-purple-lg:0 4px 6px -2px #412ca10d,0 10px 15px -3px #412ca11a;
--focus-ring:0 0 0 2px #ffffff,0 0 0 4px #a78bfa;--gradient-purple:linear-gradient(225deg,#c9aef4 0%,#9963f2 100%);
--font-sans:"Open Sans",system-ui,sans-serif;--font-title:"Helvetica Neue",Helvetica,"Open Sans",Arial,sans-serif;--font-mono:"Geist Mono",Menlo,ui-monospace,monospace;
/* legacy names used above */
--bg:var(--background);--ink:var(--foreground);--muted:#6b7089;--line:var(--border);--accent-ink:var(--primary-foreground);--rev:#e11d48}
body{font-family:var(--font-sans);background:var(--shades-50);color:var(--foreground)}
main{padding:24px 16px 96px}
h1{font-family:var(--font-title);font-size:24px;line-height:32px;font-weight:700;letter-spacing:-.4px;margin:0 0 4px}
.sub{font-size:14px;line-height:20px;color:var(--shades-400);margin:0 0 8px}
h2{font-family:var(--font-title);font-size:20px;line-height:28px;font-weight:700;letter-spacing:-.4px;text-transform:none;color:var(--foreground);margin:28px 0 12px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-xs);margin-bottom:16px}
label{font-size:14px;line-height:14px;font-weight:500;color:var(--foreground);margin:20px 0 8px}
textarea,select,input{font-family:var(--font-sans);font-size:14px;line-height:20px;background:var(--card);border:1px solid var(--input);border-radius:var(--radius-sm);padding:10px 12px;color:var(--foreground)}
textarea::placeholder{color:var(--shades-400)}
textarea:focus,select:focus,input:focus{outline:none;box-shadow:var(--focus-ring)}
button,.btn{font-family:var(--font-title);font-size:14px;line-height:20px;font-weight:700;border-radius:var(--radius-full);min-height:44px;padding:8px 24px;background:var(--card);color:var(--foreground);border:1px solid var(--input);display:inline-flex;align-items:center;justify-content:center;gap:8px}
button:hover:not(:disabled),.btn:hover{background:var(--accent)}
button:focus-visible,.btn:focus-visible{outline:none;box-shadow:var(--focus-ring)}
button:disabled{opacity:.5}
button.primary,.btn.primary{background:var(--primary);color:var(--primary-foreground);border-color:transparent}
button.primary:hover:not(:disabled){background:var(--primary);background-image:linear-gradient(#ffffff1a,#ffffff1a)}
button.big{min-height:48px;font-size:14px;margin-top:24px}
button.small{min-height:36px;padding:8px 12px;font-size:14px}
button.link{min-height:0;padding:4px 0;border:none;background:none;color:var(--primary);font-family:var(--font-title);font-weight:700}
button.link:hover{background:none;text-decoration:underline;text-underline-offset:4px}
.pick{gap:12px}
.pickbtn{min-height:0;padding:20px 24px;border-radius:var(--radius-lg);border:1px solid var(--border);box-shadow:var(--shadow-xs);align-items:flex-start;justify-content:flex-start}
.pickbtn b{font-family:var(--font-title);font-size:20px;line-height:28px;letter-spacing:-.4px}
.pickbtn span{font-family:var(--font-sans);font-weight:400;font-size:14px;color:var(--shades-400)}
.pickbtn:hover{border-color:var(--primary)!important;background:var(--card)!important;box-shadow:var(--shadow-purple-lg)}
.opts{gap:8px}
.opt{min-height:44px;justify-content:flex-start;border-radius:var(--radius-sm);padding:10px 16px;font-family:var(--font-sans);font-weight:400}
.opt.on{border-color:var(--primary);background:#9963f214;color:var(--foreground);font-weight:600;box-shadow:inset 0 0 0 1px var(--primary)}
.toggle{font-size:14px;font-weight:400;margin-top:20px}
.toggle input{accent-color:var(--primary);width:18px;height:18px}
.qshow{font-size:16px;line-height:24px}.qshow span{font-family:var(--font-title);font-weight:700;font-size:10px;line-height:16px;letter-spacing:.06em;color:var(--shades-400)}
.drawhead b{font-family:var(--font-title);font-size:20px;line-height:28px;letter-spacing:-.4px}
.tag{font-size:14px;color:var(--shades-400)}
.slot .pos{font-family:var(--font-title);font-weight:700;font-size:10px;line-height:16px;color:var(--shades-400);text-transform:uppercase;letter-spacing:.04em;min-height:0}
.face{border-radius:var(--radius-sm)}
.face.photo{border-radius:10px;box-shadow:var(--shadow-sm)}
.cap{font-size:12px;line-height:16px;margin-top:2px}
.die{border-radius:var(--radius-md);background:var(--shades-50);border-color:var(--border)}
.die .k{font-family:var(--font-title);font-weight:700;font-size:10px;color:var(--shades-400)}
.die .g{color:var(--primary)}
.hint{font-size:14px;line-height:20px;color:var(--shades-400)}
summary{font-family:var(--font-title);font-weight:700;font-size:14px;color:var(--primary)}
#prompt{font-family:var(--font-mono);font-size:12px}
details.hist{font-size:14px}
.toast{font-family:var(--font-title);font-weight:700;background:var(--foreground);color:#fff;border-radius:var(--radius-full)}
/* Table overlay in brand navy */
#ov{background:radial-gradient(ellipse at 50% 35%,#3a3270 0%,#262c45 45%,#111530 100%);font-family:var(--font-sans)}
.tb-step{font-family:var(--font-title);font-weight:700;font-size:10px;line-height:16px;color:#c4b5fd}
.tb-hint{font-size:14px;line-height:20px;color:#fff}
.tb-count{font-family:var(--font-title);font-weight:700;color:#c4b5fd}
.tb-x{min-height:0;width:40px;height:40px;padding:0;background:#a5b4fc26;border:1px solid #c4b5fd66;color:#fff}
.tb-x:hover{background:#a78bfa4d!important}
.tb-foot button{background:#a5b4fc26;color:#fff;border:1px solid #c4b5fd66}
.tb-foot button:hover:not(:disabled){background:#a78bfa4d}
.tb-foot button.primary{background:var(--primary);color:#fff;border-color:transparent}
.tb-slot{border:1px dashed #c4b5fd80;border-radius:6px}
.tb-slot span{color:#c7d2fe}
.fl{color:#c7d2fe}
.fl .cn{color:#fff}
.fc{min-height:0;border:none;padding:0;background:none!important}

/* Lenormand picture cards */
.face.lface,.ff.lff{padding:0;overflow:hidden}
.face.lface{border:1px solid #E6DFF5;box-shadow:var(--shadow-sm)}
.lcard{position:relative;width:100%;height:100%;container-type:size;background:linear-gradient(180deg,#ffffff,#f4f1fd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4cqh;color:#262c45;border-radius:inherit}
.lcard .ln{position:absolute;top:5cqh;left:8cqw;font-family:var(--font-title);font-weight:700;font-size:12cqw;line-height:1;color:#9B86EC}
.lcard .lp{position:absolute;top:5cqh;right:8cqw;font-family:var(--font-title);font-weight:700;font-size:12cqw;line-height:1;color:#262c45}
.lcard .lp.red{color:#D9669B}
.lcard .le{width:66cqw;height:66cqw;margin-top:8cqh;display:block}.lcard .le svg{width:100%;height:100%;display:block}
.lcard .lt{font-family:var(--font-title);font-weight:700;font-size:13cqw;line-height:1.1;text-align:center;padding:0 4cqw}
.gt .face.lface{height:auto;aspect-ratio:2/3;font-size:inherit}

/* Lenormand full-bleed illustrated cards */
.lsvg{width:100%;height:100%}.lsvg svg{width:100%;height:100%;display:block}
.face.lface{aspect-ratio:5/8;border:none;border-radius:10px;overflow:hidden;box-shadow:var(--shadow-sm);background:#2f2845}
.gt .face.lface{aspect-ratio:5/8;height:auto;border-radius:4px}
.rv.lenormand .fc{aspect-ratio:5/8}

/* ================= Dark theme ================= */
:root{--background:#121119;--foreground:#ece9f6;--card:#1c1a28;--border:#2e2b40;--input:#363250;--accent:#272438;--secondary:#272438;
--muted:#8f8ca8;--shades-400:#8f8ca8;--shades-50:#16151f;--bg:#121119;--ink:#ece9f6;--line:#2e2b40;--rev:#f08aa0;--focus-ring:0 0 0 2px #121119,0 0 0 4px #a78bfa}
body{background:#121119;color:#ece9f6}
.sub,.hint,.tag,.qshow span,.slot .pos,.die .k{color:#8f8ca8}
.panel{background:#1c1a28;border-color:#2e2b40;box-shadow:none}
label{color:#ece9f6}
textarea,select,input{background:#15141f;border-color:#363250;color:#ece9f6}
textarea::placeholder{color:#6f6c88}
button,.btn{background:#232033;border-color:#3a3550;color:#ece9f6}
button:hover:not(:disabled),.btn:hover{background:#2c2840}
button.primary,.btn.primary{background:#9963f2;color:#fff;border-color:transparent}
button.link{color:#c4b5fd}
.pickbtn{background:#1c1a28!important;border-color:#2e2b40}
.pickbtn:hover{border-color:#9963f2!important;box-shadow:0 0 0 1px #9963f2}
.pickbtn span{color:#8f8ca8}
.opt{background:#1c1a28}
.opt.on{background:#9963f222;color:#ece9f6}
.die{background:#16151f;border-color:#2e2b40}
.die .g{color:#c4b5fd}
summary{color:#c4b5fd}
.face{border-color:#2e2b40;background:#16151f}
.cap{color:#ece9f6}.cap .r{color:#f08aa0}
details.hist{border-color:#2e2b40}details.hist pre{background:#15141f;color:#d9d6ea}
.toast{background:#ece9f6;color:#121119}
#prompt{color:#d9d6ea}

/* ================= Glass dark theme (Design System dark tokens) ================= */
:root{--background:#020617bf;--foreground:#ffffff;--card:#97a4ec4d;--popover:#a5b4fc4d;--primary:#c4b5fd;--primary-foreground:#0f172a;
--secondary:#a5b4fc26;--muted:#a5b4fc26;--muted-foreground:#c7d2fe;--accent:#a78bfa4d;--border:#c4b5fdb2;--input:#c4b5fd;--ring:#cbd5e1;--blur:24px}
html{background:#020617}
body{background:transparent;color:#fff;min-height:100vh}
body::before{content:"";position:fixed;inset:-20%;z-index:-2;background:
 radial-gradient(45% 32% at 18% 18%,#9963f2 0%,transparent 72%),
 radial-gradient(35% 28% at 85% 35%,#e879f9 0%,transparent 70%),
 radial-gradient(50% 38% at 28% 72%,#6366f1 0%,transparent 72%),
 radial-gradient(30% 25% at 80% 90%,#00b69b 0%,transparent 70%);filter:blur(30px);opacity:.95}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:var(--background)}
.glass,.panel,.pickbtn,.opt,button,.btn,textarea,select,input,.die,details.hist pre{-webkit-backdrop-filter:blur(var(--blur)) saturate(140%);backdrop-filter:blur(var(--blur)) saturate(140%)}
.panel{background:rgba(151,164,236,.14);border:1px solid rgba(196,181,253,.28);box-shadow:0 8px 32px rgba(2,6,23,.35),inset 0 1px 0 rgba(255,255,255,.08)}
h1,h2,.drawhead b,.pickbtn b{color:#fff}
.sub,.hint,.tag,.qshow span,.slot .pos,.die .k,.pickbtn span{color:#c7d2fe!important}
label,.toggle{color:#fff}
textarea,select,input{background:rgba(2,6,23,.35);border:1px solid rgba(196,181,253,.45);color:#fff}
textarea::placeholder{color:rgba(199,210,254,.6)}
button,.btn{background:rgba(165,180,252,.15);border:1px solid rgba(196,181,253,.45);color:#fff}
button:hover:not(:disabled),.btn:hover{background:rgba(167,139,250,.3)}
button.primary,.btn.primary{background:#c4b5fd;color:#0f172a;border-color:transparent;box-shadow:0 4px 20px rgba(153,99,242,.35)}
button.primary:hover:not(:disabled){background:#d4c8fe}
button.link{background:none!important;border:none;color:#c4b5fd;-webkit-backdrop-filter:none;backdrop-filter:none}
.pickbtn{background:rgba(151,164,236,.14)!important;border:1px solid rgba(196,181,253,.28)}
.pickbtn:hover{border-color:#c4b5fd!important;box-shadow:0 0 0 1px #c4b5fd,0 8px 32px rgba(153,99,242,.25)}
.opt{background:rgba(165,180,252,.1);border:1px solid rgba(196,181,253,.3);color:#fff}
.opt.on{background:rgba(167,139,250,.3);border-color:#c4b5fd;box-shadow:inset 0 0 0 1px #c4b5fd}
.toggle input{accent-color:#c4b5fd}

.hs-head h2{margin:0}
.hs-x{min-height:36px;width:36px;padding:0;color:#fff}
.hs .hist{margin-bottom:10px}

// ---------- Random ----------
function rint(n){const a=new Uint32Array(1);const lim=Math.floor(4294967296/n)*n;let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=lim);return x%n}
function fy(arr){for(let i=arr.length-1;i>0;i--){const j=rint(i+1);[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function splitDeck(deck,n){const L=deck.length,b=[0];for(let k=1;k<n;k++){const base=Math.round(L*k/n);b.push(base+rint(Math.floor(L/8)+1)-Math.floor(L/16))}b.push(L);const p=[];for(let k=0;k<n;k++)p.push(deck.slice(b[k],b[k+1]));return p}

function positions(d){
  if(d.spread==="free"){const n=d.picks?d.picks.length:(TB.d===d?TB.picks.length:0);return Array.from({length:n},(_,i)=>"Card "+(i+1))}
  if(d.type==="tarot")return TSPREADS[d.spread].pos;
  return LSPREADS[d.spread].pos;
}
function spreadLabel(d){
  if(d.spread==="free"){const n=positions(d).length;return "Free draw ("+n+" card"+(n===1?"":"s")+")"}

}

// ---------- Views ----------
function faceHTML(d,x){
  if(d.type==="tarot")return `<div class="face photo${x.r?" rev":""}"><img src="${x.c.img}" alt="${x.c.name}"></div><div class="cap">${x.c.name}${x.r?'<span class="r"> · Reversed</span>':""}</div>`;

}
const diceHTML=(res,rolling)=>`<div class="dice${rolling?" rolling":""}">${[["Planet",res&&res.planet,res&&GLYPH[res.planet]],["Sign",res&&res.sign,res&&GLYPH[res.sign]],["House",res&&ord(res.house),res&&String(res.house)]].map(([k,v,g])=>`<div class="die"><div class="k">${k}</div><div class="g">${g?g+(k==="House"?"":VS):"?"}</div><div class="v">${v||"&nbsp;"}</div></div>`).join("")}</div>`;
function resultPanel(d,idx){
  let h=`<div class="panel"><div class="drawhead"><b>${S.draws.length>1?(idx+1)+" · ":""}${TYPEINFO[d.type][0]}</b>${S.draws.length>1?`<button class="small" data-act="remove" data-id="${d.id}">Remove</button>`:""}</div>`;
  if(d.q&&d.q.trim())h+=`<div class="qshow" style="margin:6px 0 4px"><span>Follow-up question</span>${esc(d.q.trim())}</div>`;

}

  <div class="row split"><div><label>Reading style</label><select data-in="style">${Object.entries({gentle:"Gentle & supportive",direct:"Direct & honest",practical:"Practical & action-focused",psych:"Psychological & reflective"}).map(([k,v])=>`<option value="${k}"${k===S.style?" selected":""}>${esc(v)}</option>`).join("")}</select></div>
  <div><label>Length</label><select data-in="detail">${[["detailed","Detailed"],["concise","Concise"]].map(([k,v])=>`<option value="${k}"${k===S.detail?" selected":""}>${v}</option>`).join("")}</select></div></div>
  <label>Prompt</label><textarea id="prompt" readonly></textarea></details></div>
  <div class="row split"><button data-act="followup">+ Follow-up draw</button><button data-act="reset">New reading</button></div>`;
  return h;
}
function render(){
  $id("view").innerHTML=S.view==="home"?viewHome():S.view==="setup"?viewSetup():viewResult();
  updatePrompt();
}

// ---------- Table (the ritual) ----------
const ov=$id("ov");
let TB={},P=null;
function openTable(d){
  TB={d,N:d.type==="tarot"?78:36,src:d.type==="tarot"?TAROT:LEN,need:d.spread==="free"?15:positions(d).length,picks:[],energy:0,zTop:0};
  ov.innerHTML=`<div class="tb-head"><button class="tb-x" data-tb="close" aria-label="Close">✕</button><div><div class="tb-step" id="tbStep"></div><div class="tb-hint" id="tbHint"></div></div><div class="tb-count" id="tbCount"></div></div><div class="tb-table" id="tbTable"></div><div class="tb-foot" id="tbFoot"></div>`;
  ov.classList.add("on");document.body.classList.add("lock");
  const t=$id("tbTable");
  t.addEventListener("pointerdown",onDown);t.addEventListener("pointermove",onMove);
  t.addEventListener("pointerup",onUp);t.addEventListener("pointercancel",()=>{if(P&&P.hold)releaseHold();P=null});t.addEventListener("contextmenu",e=>e.preventDefault());
  requestAnimationFrame(()=>{measure();scatter()});
}
function closeTable(){if(TB.loop)cancelAnimationFrame(TB.loop);ov.classList.remove("on");ov.innerHTML="";document.body.classList.remove("lock");P=null;clearTimeout(TB.at);TB={}}
function measure(){
  const t=$id("tbTable"),r=t.getBoundingClientRect();
  TB.W=r.width;TB.H=r.height;
  TB.CW=Math.round(Math.max(54,Math.min(86,TB.W*0.16)));TB.CH=Math.round(TB.CW*(TB.d.type==="tarot"?1.757:1.6));
  t.style.setProperty("--cw",TB.CW+"px");t.style.setProperty("--ch",TB.CH+"px");
}
function place(c){
  let tr;
  if(c.mode==="fan")tr=`translate(${TB.PX-TB.CW/2}px,${TB.PY-TB.CH/2}px) rotate(${TB.fanOffset+c.fanA}deg) translateY(${-TB.R}px)`;
  else tr=`translate(${c.x-TB.CW/2}px,${c.y-TB.CH/2}px) rotate(${c.rot}deg) scale(${c.s||1})`;
  c.el.style.transform=tr;c.el.style.zIndex=c.z;
}
function animate(fn,ms){const t=$id("tbTable");t.classList.add("anim");fn();clearTimeout(TB.at);TB.at=setTimeout(()=>{t.classList.remove("anim");TB.cards&&TB.cards.forEach(c=>c.el.style.transitionDelay="")},ms)}
function setText(step,hint,count){$id("tbStep").textContent=step;$id("tbHint").textContent=hint;$id("tbCount").textContent=count||""}
const deckName=()=>TB.d.type==="tarot"?"Tarot":"Lenormand";

function backClass(){return TB.d.type==="tarot"?"back-rws":"back-art"}
function polar(c){c.x=TB.cx+Math.cos(c.ang)*c.rn*TB.ax;c.y=TB.cy+Math.sin(c.ang)*c.rn*TB.ay}
function scatter(){
  const t=$id("tbTable"),ids=fy([...Array(TB.N).keys()]);
  TB.cx=TB.W/2;TB.cy=TB.H/2;TB.ax=TB.W/2-TB.CW*0.45;TB.ay=Math.min(TB.H/2-TB.CH*0.45,TB.ax*1.2);
  TB.cards=ids.map((cid,i)=>{
    const el=document.createElement("div");el.className="tcard "+backClass();
    const c={cid,el,ang:Math.random()*Math.PI*2,rn:Math.sqrt(Math.random())*0.95,rot:Math.random()*360,z:i,mode:"free",spd:0.6+Math.random()*0.8};
    c.tr=c.rn;polar(c);el._c=c;t.appendChild(el);place(c);return c;
  });
  TB.zTop=TB.N;TB.stage="shuffle";TB.v=0;TB.holding=false;
  setText(deckName()+" · Shuffle","Press and hold anywhere on the table to shuffle");
  $id("tbFoot").innerHTML=`<button class="primary" data-tb="gather" id="tbGather" disabled>Gather the cards</button>`;
}
function swirlLoop(){
  if(TB.loop)return;let last=performance.now();
  const step=now=>{
    if(TB.stage!=="shuffle"){TB.loop=null;return}
    const dt=Math.min(40,now-last)/16.7;last=now;
    TB.v+=((TB.holding?1:0)-TB.v)*Math.min(1,0.07*dt);
    if(!TB.holding&&TB.v<0.01){TB.v=0;TB.loop=null;return}
    const k=dt*TB.v;
    for(const c of TB.cards){
      if(Math.random()<0.012*k)c.tr=0.06+Math.random()*0.42;
      c.ang+=c.spd*0.05*k/(0.35+c.rn);
      c.rn+=(c.tr-c.rn)*0.03*k;
      c.rot+=c.spd*6*k;
      if(Math.random()<0.05*k)c.z=++TB.zTop;
      polar(c);place(c);
    }
    TB.energy+=k;
    if(TB.energy>70){const g=$id("tbGather");if(g&&g.disabled)g.disabled=false}
    TB.loop=requestAnimationFrame(step);
  };
  TB.loop=requestAnimationFrame(step);
}
function gather(){
  TB.stage="gathering";TB.holding=false;
  TB.deck=[...TB.cards].sort((a,b)=>b.z-a.z); // index 0 = top of deck
  const N=TB.N;
  TB.deck.forEach((c,k)=>{
    c.r=TB.d.type==="tarot"&&TB.d.rev&&Math.cos(c.rot*Math.PI/180)<0;
    let tgt=Math.round(c.rot/360)*360+(c.r?180:0);
    while(tgt-c.rot>180)tgt-=360;while(c.rot-tgt>180)tgt+=360;
    c.rot=tgt;c.x=TB.W/2;c.y=TB.H/2+(k-N/2)*0.25;c.z=1000+N-k;
  });
  animate(()=>TB.deck.forEach((c,k)=>{c.el.style.transitionDelay=((N-k)*5)+"ms";place(c)}),N*5+700);
  setTimeout(()=>{
    TB.stage="cut";
    setText(deckName()+" · Cut","Cut the deck into piles?");
    $id("tbFoot").innerHTML=`<button data-tb="cut" data-n="1">No cut</button><button data-tb="cut" data-n="2">2 piles</button><button data-tb="cut" data-n="3">3 piles</button>`;
  },N*5+500);
}
function cut(n){
  if(n===1){ready();return}
  TB.piles=splitDeck(TB.deck,n);TB.cutOrder=[];TB.stackH=0;TB.stage="restack";
  const gap=TB.CW+Math.min(32,TB.W*0.06),py=TB.H/2-TB.CH*0.55;
  TB.piles.forEach((p,pi)=>{const px=TB.W/2+(pi-(n-1)/2)*gap;p.forEach((c,j)=>{c.pile=pi;c.x=px;c.y=py+(j-p.length/2)*0.25;c.z=1000+p.length-j})});
  animate(()=>TB.deck.forEach(place),700);
  setText(deckName()+" · Cut","Tap the piles to stack them back up, in any order");
  $id("tbFoot").innerHTML="";
}
function tapPile(pi){
  if(TB.cutOrder.includes(pi))return;
  TB.cutOrder.push(pi);
  const p=TB.piles[pi],sy=TB.H/2+TB.CH*0.75;
  for(let j=p.length-1;j>=0;j--){const c=p[j];TB.stackH++;c.x=TB.W/2;c.y=sy-TB.stackH*0.25;c.z=3000+TB.stackH}
  animate(()=>p.forEach(place),700);
  if(TB.cutOrder.length===TB.piles.length){
    TB.deck=[...TB.cutOrder].reverse().flatMap(k=>TB.piles[k]);
    setTimeout(ready,650);
  }
}
function ready(){
  TB.stage="ready";
  const gt=TB.d.spread==="gt";
  setText(deckName()+" · Draw",gt?"The Grand Tableau uses the whole deck":"Spread the cards out");
  $id("tbFoot").innerHTML=gt?`<button class="primary" data-tb="layAll">Lay out all 36</button>`:`<button class="primary" data-tb="spread">Spread the cards</button>`;
}
function spread(){
  const N=TB.N;
  TB.R=Math.max(360,Math.min(1000,TB.W*1.2));
  TB.step=TB.d.type==="tarot"?(TB.R<520?2.9:2.4):(TB.R<520?4.6:3.8);
  TB.PX=TB.W/2;TB.PY=TB.H-TB.CH*0.95+TB.R;TB.fanOffset=0;TB.fanMax=Math.max(0,(N-1)/2*TB.step-12);
  // slots
  const free=TB.d.spread==="free";
  const pos=positions(TB.d),n=pos.length,cols=free?6:(n<=5?n:Math.ceil(n/2));
  const sw=Math.floor(Math.min(free?52:62,(TB.W-16)/cols-10));TB.sw=sw;
  const sl=document.createElement("div");sl.className="tb-slots";sl.id="tbSlots";
  sl.innerHTML=pos.map(p=>`<div class="tb-slot" style="width:${sw}px;height:${Math.round(sw*TB.CH/TB.CW)}px"><span>${esc(p.replace(/\s*\(.*\)/,""))}</span></div>`).join("");
  $id("tbTable").appendChild(sl);
  TB.deck.forEach((c,k)=>{c.mode="fan";c.k=k;c.fanA=(k-(N-1)/2)*TB.step;c.z=100+k});
  animate(()=>TB.deck.forEach((c,k)=>{c.el.style.transitionDelay=(k*7)+"ms";place(c)}),N*7+700);
  TB.stage="fan";updatePickText();
  $id("tbFoot").innerHTML=free?`<button class="primary" data-tb="doneDraw" id="tbDone" disabled>Done drawing</button>`:`<button data-tb="auto">Draw for me</button>`;
}
function updatePickText(){
  const pos=positions(TB.d),k=TB.picks.length;
  if(TB.d.spread==="free"){setText(deckName()+" · Draw",k?"Keep drawing, or tap Done when the reading feels complete":"Swipe to move the fan. Tap cards to draw as many as you like",k?String(k):"");return}
  setText(deckName()+" · Draw",k<TB.need?`Swipe to move the fan, tap a card to draw it. Next: ${pos[k].replace(/\s*\(.*\)/,"")}`:"All cards drawn",`${k}/${TB.need}`);
}
function pickCard(c){
  if(TB.stage!=="fan"||c.mode!=="fan")return;
  const k=TB.picks.length;if(k>=TB.need)return;
  TB.picks.push(c.k);c.mode="slot";if(TB.src[c.cid].img)new Image().src=TB.src[c.cid].img;c.rot=0;c.z=5000+k;
  if(TB.d.spread==="free"){
    $id("tbSlots").insertAdjacentHTML("beforeend",`<div class="tb-slot" style="width:${TB.sw}px;height:${Math.round(TB.sw*TB.CH/TB.CW)}px"><span>${k+1}</span></div>`);
    const d=$id("tbDone");if(d)d.disabled=false;
  }
  const slots=document.querySelectorAll(".tb-slot"),tr=$id("tbTable").getBoundingClientRect();
  TB.picks.forEach((di,i)=>{const pc=TB.deck[di],sr=slots[i].getBoundingClientRect();
    pc.x=sr.left-tr.left+sr.width/2;pc.y=sr.top-tr.top+sr.height/2;pc.s=sr.width/TB.CW;
    pc.el.style.transition="transform .5s cubic-bezier(.2,.7,.2,1)";pc.el.style.transitionDelay="0ms";place(pc)});
  try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}
  const rest=TB.deck.filter(x=>x.mode==="fan");
  rest.forEach((x,i)=>{x.fanA=(i-(rest.length-1)/2)*TB.step});
  TB.fanMax=Math.max(0,(rest.length-1)/2*TB.step-12);TB.fanOffset=Math.max(-TB.fanMax,Math.min(TB.fanMax,TB.fanOffset));
  animate(()=>rest.forEach(place),600);
  updatePickText();
  if(TB.picks.length===TB.need){TB.stage="drawn";$id("tbFoot").innerHTML="";setTimeout(showReveal,850)}
}
function autoDraw(){
  $id("tbFoot").innerHTML="";
  const next=()=>{if(TB.stage!=="fan")return;const c=TB.deck.find(x=>x.mode==="fan");if(c){pickCard(c);setTimeout(next,230)}};next();
}
function frontInner(card,r){
  if(TB.d.type==="tarot")return `<img class="cimg" src="${card.img}" alt="">`;
  return lcardHTML(card);
}
function showReveal(){
  TB.stage="reveal";
  const t=$id("tbTable"),pos=positions(TB.d),gt=TB.d.spread==="gt";
  t.classList.add("rv-mode");
  t.innerHTML=`<div class="rv${gt?" gt":""}${TB.d.type==="tarot"?" tarot":" lenormand"}"><div class="rv-grid" style="max-width:${gt?640:Math.min(pos.length,5)*134}px">${pos.map((p,i)=>{const c=TB.deck[TB.picks[i]];return `<div class="rv-slot${gt&&i===32?" fate first":""}"><button class="fc" data-tb="flip" data-i="${i}"><div class="fci"><div class="fb ${backClass()}"></div><div class="ff${c.r?" rev":""}${TB.d.type==="tarot"?" photo":" lff"}">${frontInner(TB.src[c.cid],c.r)}</div></div></button><div class="fl">${TB.d.type==="tarot"?`<b class="cn">${TB.src[c.cid].name}${c.r?" · Reversed":""}</b>`:""}${gt?(i+1):esc(p)}</div></div>`}).join("")}</div></div>`;
  TB.flipped=pos.map(()=>false);
  setText(deckName()+" · Reveal","Tap each card to turn it over");
  $id("tbFoot").innerHTML=`<button data-tb="revealAll">Reveal all</button><button class="primary" data-tb="finish">Done</button>`;
}
function flip(i){if(TB.flipped[i])return;TB.flipped[i]=true;const b=document.querySelector(`.fc[data-i="${i}"]`);b.classList.add("open");b.parentNode.classList.add("open")}
function finish(){
  const d=TB.d;
  d.deck=TB.deck.map(c=>({c:TB.src[c.cid],r:!!c.r}));
  d.picks=TB.picks.slice();d.stage="done";
  if(!S.draws.includes(d))S.draws.push(d);
  S.cur=null;S.view="result";
  closeTable();render();window.scrollTo(0,0);
}

// pointer handling on the table
function onDown(e){
  const t=$id("tbTable");
  if(TB.stage==="shuffle"){
    try{t.setPointerCapture(e.pointerId)}catch(_){}
    P={id:e.pointerId,hold:true};TB.holding=true;
    $id("tbHint").textContent="Shuffling… let go when it feels right";swirlLoop();return;
  }
  if(!["fan","restack"].includes(TB.stage))return;
  try{t.setPointerCapture(e.pointerId)}catch(_){}
  const tc=e.target.closest(".tcard");
  P={id:e.pointerId,x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,drag:false,card:tc?tc._c:null};
  if(TB.stage==="fan")t.classList.remove("anim");
}
function onMove(e){
  if(!P||P.hold||e.pointerId!==P.id)return;
  const dx=e.clientX-P.x;P.x=e.clientX;P.y=e.clientY;
  if(Math.hypot(e.clientX-P.x0,e.clientY-P.y0)>7)P.drag=true;
  if(TB.stage==="fan"&&P.drag){
    TB.fanOffset=Math.max(-TB.fanMax,Math.min(TB.fanMax,TB.fanOffset+dx/TB.R*180/Math.PI));
    for(const c of TB.deck)if(c.mode==="fan")place(c);
  }
}
function releaseHold(){TB.holding=false;P=null;if(TB.stage==="shuffle")$id("tbHint").textContent="Hold again to keep shuffling, or gather the cards"}
function onUp(e){
  if(!P||e.pointerId!==P.id)return;
  if(P.hold){releaseHold();return}
  const p=P;P=null;
  if(p.drag||!p.card)return;
  if(TB.stage==="fan")pickCard(p.card);
  else if(TB.stage==="restack")tapPile(p.card.pile);
}
ov.addEventListener("click",e=>{
  const b=e.target.closest("[data-tb]");if(!b)return;
  const a=b.dataset.tb;
  if(a==="close"){closeTable();render();return}
  if(a==="gather")gather();
  if(a==="cut")cut(+b.dataset.n);
  if(a==="spread")spread();
  if(a==="layAll"){TB.picks=TB.deck.map((_,i)=>i);showReveal()}
  if(a==="auto")autoDraw();
  if(a==="doneDraw"&&TB.picks.length&&TB.stage==="fan"){TB.stage="drawn";$id("tbFoot").innerHTML="";setTimeout(showReveal,350)}
  if(a==="flip")flip(+b.dataset.i);
  if(a==="revealAll")TB.flipped.forEach((f,i)=>{if(!f)setTimeout(()=>flip(i),i*(TB.N===36&&TB.flipped.length===36?40:160))});
  if(a==="finish")finish();
});

// ---------- Prompt ----------
function cardText(d,x){
  if(d.type==="tarot")return x.c.name+(d.rev?(x.r?" (reversed)":" (upright)"):"");
  return x.c.name+" (#"+x.c.num+", "+x.c.play+")";
}
function buildPrompt(){
  const done=S.draws.filter(d=>d.stage==="done");
  if(!done.length)return "";
  const types=[...new Set(done.map(d=>d.type))];
  const roles=types.map(t=>({tarot:"tarot reader",lenormand:"Lenormand reader",dice:"astrologer experienced with astrology dice"})[t]);
  const roleStr=roles.length===1?roles[0]:roles.slice(0,-1).join(", ")+" and "+roles[roles.length-1];
  const L=[];
  L.push(`You are an experienced, professional ${roleStr}.`);
  L.push(`Reading style: ${STYLES[S.style]}.`);
  L.push(`Length: ${S.detail==="concise"?"concise. Keep it focused and brief.":"detailed. Go into depth for each position."}`);
  L.push("","QUESTION",S.question.trim()||"No specific question. Give a general reading of my current situation and what I should pay attention to.");
  if(S.notes.trim())L.push("","BACKGROUND",S.notes.trim());
  L.push("","THE DRAW","These results were drawn in an app with a real shuffle, cut and draw. Treat them as final.");
  done.forEach((d,i)=>{
    L.push("");const fq=(d.q||"").trim();
    if(d.type==="dice"){L.push(`[${i+1}] Astrology dice`,...(fq?["Follow-up question for this draw: "+fq]:[]),`Planet: ${d.res.planet}`,`Sign: ${d.res.sign}`,`House: ${ord(d.res.house)} house`);return}
    const pos=positions(d);
    if(d.type==="tarot"){
      L.push(`[${i+1}] Tarot · ${spreadLabel(d)} · Rider–Waite–Smith deck · ${d.rev?"reversals in use":"reversals not used"}`);if(fq)L.push("Follow-up question for this draw: "+fq);
      if(TSPREADS[d.spread]&&TSPREADS[d.spread].note)L.push(TSPREADS[d.spread].note);
      pos.forEach((p,k)=>L.push(`${k+1}. ${p}: ${cardText(d,d.deck[d.picks[k]])}`));
    }else{
      L.push(`[${i+1}] Lenormand · ${spreadLabel(d)}`);if(fq)L.push("Follow-up question for this draw: "+fq);
      if(d.spread==="gt"){
        L.push(`Significator: ${d.sig}.`,"Layout: 4 rows of 8 cards, then a final row of 4 (the cards of fate). Each position is also a house: position N is the house of Lenormand card N.");
        const nm=k=>d.deck[d.picks[k]].c.name;
        for(let r=0;r<4;r++)L.push(`Row ${r+1}: `+Array.from({length:8},(_,c)=>`${r*8+c+1}·${nm(r*8+c)}`).join(" | "));
        L.push("Row 5 (cards of fate): "+[32,33,34,35].map(k=>`${k+1}·${nm(k)}`).join(" | "));
        L.push("Card by position:");
        pos.forEach((p,k)=>L.push(`${p}: ${cardText(d,d.deck[d.picks[k]])}`));
      }else{
        if(LSPREADS[d.spread].note)L.push(LSPREADS[d.spread].note);
        pos.forEach((p,k)=>L.push(`${k+1}. ${p}: ${cardText(d,d.deck[d.picks[k]])}`));
      }
    }
  });
  L.push("","HOW TO READ");
  L.push("- Interpret only the cards and dice listed above. Do not draw new cards, change orientations or add anything that is not listed.");
  if(types.includes("tarot")){
    const anyRev=done.some(d=>d.type==="tarot"&&d.rev);
    L.push("- Tarot: read each card in its position, then how the cards relate to each other (repeated suits or numbers, the share of Major Arcana).");
    L.push(anyRev?"- Tarot reversals: where a card is marked reversed, read it as reversed in the way that fits the context. Where reversals are not used, read every card upright.":"- Tarot: reversals were not used. Read every card upright.");
  }
  if(types.includes("lenormand")){
    L.push("- Lenormand: no reversals. Read cards in combination, not in isolation: the first card is usually the subject and the next card describes it. Treat the playing-card inserts as a secondary layer only.");
    if(done.some(d=>d.spread==="gt"))L.push("- Grand Tableau: find the significator, then read the cards close to it (closer = more relevant), its row and column, the house it falls in, and the cards of fate. Note which houses the key topic cards fall in.");
  }
  if(types.includes("dice"))L.push("- Astrology dice: the planet is WHAT energy is active, the sign is HOW it expresses itself, and the house is WHERE in life it shows up. Combine the three into one message.");
  if(done.some(d=>(d.q||"").trim()))L.push("- Some draws have their own follow-up question. Answer each follow-up using that draw, in the context of the main question.");
  if(done.length>1)L.push("- Several draws were made. Read each on its own first, then give a synthesis: where they agree, where they differ, and the combined message.");
  L.push("- Answer the question directly. If the draw does not support a clear yes or no, say so instead of forcing one.");
  L.push("- Avoid fatalistic predictions. Frame challenges together with what I can do about them.");
  L.push("","FORMAT","1. Short answer (2–3 sentences)","2. Position-by-position reading","3. Synthesis"+(done.length>1?" across all draws":""),"4. Practical advice: 2–3 concrete next steps","","Reply in English.");
  return L.join("\n");
}
function updatePrompt(){
  if(!$id("prompt"))return;
  const p=buildPrompt();
  $id("prompt").value=p;
  const q=p?encodeURIComponent(p):"";
  $id("gptLink").href=p?"https://chatgpt.com/?q="+q:"https://chatgpt.com/";
  $id("claudeLink").href=p?"https://claude.ai/new?q="+q:"https://claude.ai/new";
  $id("copyBtn").disabled=!p;
}

// ---------- History ----------
const HKEY="rpb.history.v1";
function loadHist(){try{return JSON.parse(localStorage.getItem(HKEY)||"[]")}catch(e){return []}}
function saveHist(p){
  try{const h=loadHist();if(h[0]&&h[0].p===p)return;h.unshift({t:Date.now(),q:S.question.trim(),p});localStorage.setItem(HKEY,JSON.stringify(h.slice(0,30)))}catch(e){}
  renderHist();
}
function renderHist(){
  const h=loadHist(),el=$id("history");if(!el)return;
  if(!h.length){el.innerHTML='<p class="hint" style="margin:0">Prompts you copy are saved here on this device.</p>';return}
  el.innerHTML=h.map((x,i)=>`<details class="hist"><summary>${new Date(x.t).toLocaleString()} · ${esc(x.q||"General reading").slice(0,60)}</summary><pre>${esc(x.p)}</pre><button class="small" data-act="copyHist" data-i="${i}">Copy again</button></details>`).join("");
}

// ---------- Copy ----------
function toast(m){const t=$id("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),1600)}
async function copyText(text){
  try{await navigator.clipboard.writeText(text);return true}catch(e){}
  try{const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,text.length);const ok=document.execCommand("copy");ta.remove();return ok}catch(e){return false}
}

document.addEventListener("click",e=>{if(e.target.id==="hs"){e.target.hidden=true;document.body.style.overflow=""}});
// ---------- Main page events ----------
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,d=S.cur;let top=false;
  switch(a){
    case "choose":S.cur=newDraw(b.dataset.type);S.view="setup";top=true;break;
    case "back":S.cur=null;S.view="home";top=true;break;
    case "toResult":S.view="result";top=true;break;
    case "spread":d.spread=b.dataset.v;break;
    case "start":openTable(d);return;
    case "roll":d.stage="rolling";render();setTimeout(()=>{d.res={planet:PLANETS[rint(12)],sign:SIGNS[rint(12)],house:rint(12)+1};d.stage="done";S.draws.push(d);S.cur=null;S.view="result";render();window.scrollTo(0,0)},900);return;
    case "remove":{const x=getDraw(b.dataset.id);S.draws=S.draws.filter(y=>y!==x);if(!S.draws.length)S.view="home";break}
    case "followup":S.view="home";top=true;break;
    case "reset":S.draws=[];S.question="";S.notes="";S.cur=null;S.view="home";top=true;break;
    case "copy":{const p=buildPrompt();if(!p)return;const ok=await copyText(p);toast(ok?"Prompt copied":"Copy failed. Open the preview and copy it manually");if(ok)saveHist(p);return}
    case "openHist":renderHist();$id("hs").hidden=false;document.body.style.overflow="hidden";return;
    case "closeHist":$id("hs").hidden=true;document.body.style.overflow="";return;
    case "copyHist":{const h=loadHist()[+b.dataset.i];if(h){const ok=await copyText(h.p);toast(ok?"Copied":"Copy failed")}return}
    default:return;
  }
  render();if(top)window.scrollTo(0,0);
});
document.addEventListener("change",e=>{
  const f=e.target.dataset.field;
  if(f==="q")return;
  if(f&&S.cur){const d=S.cur;if(f==="rev")d.rev=e.target.checked;else if(f==="n")d.n=Math.max(1,Math.min(12,parseInt(e.target.value)||1));else d[f]=e.target.value;render();return}
  const k=e.target.dataset.in;if(k){S[k]=e.target.value;updatePrompt()}
});
document.addEventListener("input",e=>{if(e.target.dataset.field==="q"&&S.cur){S.cur.q=e.target.value;return}const k=e.target.dataset.in;if(k&&e.target.tagName==="TEXTAREA")S[k]=e.target.value});
render();
// Offline support when hosted on its own https site (skipped inside other pages)
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&window.top===window.self)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
</script>
</body>
